name = "kusakuzushi-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "kusakuzushi.toshi0607.com/mcp*", zone_id = "ea6ad3e0ad5be8d094dd62dc14536b07" }
]

# Pages allowed to call /mcp from JavaScript. The page bridge is same-origin;
# every other browser origin is refused before the handler sees the request.
# Local development and E2E override this through .dev.vars (or --var).
[vars]
ALLOWED_ORIGINS = "https://kusakuzushi.toshi0607.com"

# One bucket per client IP for everything that reaches /mcp.
# namespace_id must be unique within the account (workers/ogp uses 46802917-46802919).
[[ratelimits]]
name = "MCP_REQUEST_RATE_LIMITER"
namespace_id = "46802920"
simple = { limit = 60, period = 60 }

# The first deployment kept MCP sessions in a Durable Object (McpAgent). The
# server is stateless now, so the class is gone; the migration retires its
# namespace (and the session rows it had accumulated).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["KusakuzushiMcp"]

[[migrations]]
tag = "v2"
deleted_classes = ["KusakuzushiMcp"]

# Both tools are thin proxies over the OGP Worker (`/share/*/og.png` and
# `/api/grid/*`). Same-zone Workers cannot fetch each other's routes, so this
# Service Binding is the only way in — and it skips the public Internet.
[[services]]
binding = "OGP"
service = "kusakuzushi-ogp"
