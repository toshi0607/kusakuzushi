name: Lighthouse

# しきい値と計測対象は lighthouserc.cjs が正。ここは「いつ回すか」だけを決める。
# ci.yml とは別ワークフローにしてある(Lighthouse の失敗でテスト結果が読めなくならないように)。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 毎日 06:00 JST。本番(デプロイ済みの実物)の劣化を拾うため
    - cron: "0 21 * * *"
  workflow_dispatch:

# GITHUB_TOKEN を最小権限に固定する(リポジトリ既定値に依存しない)。
# 計測して artifact を上げるだけなので読み取りで足りる。
permissions:
  contents: read

# サードパーティの action(pnpm/action-setup)はフルコミット SHA で固定する。
# 方針は ci.yml と同じ。

jobs:
  # PR / main: ビルド成果物をローカル配信して計測する。
  # 外部要因(回線・DNS・Pages の状態)が入らないので、差分の影響だけが出る。
  dist:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fork PR のコードを実行するので GITHUB_TOKEN を .git/config に残さない
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kusakuzushi/web build

      # ubuntu-latest ランナーには google-chrome-stable が同梱されており、
      # lhci(chrome-launcher)が自動で見つける
      - run: pnpm exec lhci autorun

      # 緑でも実測値をログに残す(assertion は落ちた項目しか出さないため)
      - if: always()
        run: node tools/lh-summary.mjs

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-dist
          path: .lighthouseci/report
          retention-days: 30

  # PR / main: 同じ成果物を TTFB 170ms のサーバから配信して計測する。
  # dist ジョブは localhost 配信(RTT ≒ 0)なのでクリティカルパスの往復が増えても
  # 気づけない。実オリジンの往復コストを持ち込むのがこのジョブの役割(セッション12)。
  slow:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fork PR のコードを実行するので GITHUB_TOKEN を .git/config に残さない
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kusakuzushi/web build

      - run: pnpm exec lhci autorun
        env:
          KUSAKUZUSHI_LH_TARGET: slow

      # 緑でも実測値をログに残す(assertion は落ちた項目しか出さないため)
      - if: always()
        run: node tools/lh-summary.mjs

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-slow
          path: .lighthouseci/report
          retention-days: 30

  # schedule / 手動: 本番 URL をそのまま計測する
  production:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # このジョブは fork PR では走らないが、扱いを他ジョブと揃えておく
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec lhci autorun
        env:
          KUSAKUZUSHI_LH_TARGET: production

      # 緑でも実測値をログに残す(assertion は落ちた項目しか出さないため)
      - if: always()
        run: node tools/lh-summary.mjs

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-production
          path: .lighthouseci/report
          retention-days: 30
