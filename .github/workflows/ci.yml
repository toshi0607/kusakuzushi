name: CI

# main へのマージで本番へ出るまでを 1 本のワークフローに入れてある。
# ジョブ間の `needs` でしか順序は保証できず、ワークフローをまたぐ依存
# (workflow_run)は checkout する ref の指定を間違えやすいため。
#
# Lighthouse は別ワークフロー(lighthouse.yml)のまま。PR で必ず走る退行ゲートなので、
# main に入った時点で通過済みとみなし、デプロイは待たせない。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN を最小権限に固定する(リポジトリ既定値に依存しない)。
# デプロイの認証は Cloudflare の API トークンで、GITHUB_TOKEN は使わない。
permissions:
  contents: read

# サードパーティの action はフルコミット SHA で固定する(タグは書き換えられる)。
# actions/* は GitHub 管理なのでメジャータグのままにしている。
# パブリックリポジトリでは fork から PR が来るので、この非対称な扱いを意図的に選んでいる。

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # persist-credentials: false — このジョブは fork PR のコードを実行するので、
      # GITHUB_TOKEN を .git/config に残さない。git 操作はどのジョブでも使っていない
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r test

      # Type-checking only happens in the build scripts (tsc), so a test-only
      # CI would let type errors through.
      - run: pnpm -r build

      # デプロイするのは「テストとビルドを通したこの成果物」そのものにする。
      # deploy ジョブで build し直すと、本番の中身が手元の dist と同じであることが
      # 状況証拠にしかならない(セッション6/12 の切り分けコストはそこに由来した)。
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          # 既定では隠しファイルが落ちる。将来 public/.well-known/... を足したとき
          # artifact から静かに欠落して本番にも出ない、という壊れ方を防ぐ
          include-hidden-files: true

  # 変更パスを見て、どちらをデプロイするか決める。
  # PR では走らない(= deploy-* も needs 経由でスキップされる)。
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ogp: ${{ steps.filter.outputs.ogp }}
    steps:
      - uses: actions/checkout@v7
        with:
          # push の前後を diff するので履歴が要る。95 コミット規模なので全部取る
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # force push や初回 push では before を辿れない。取りこぼすくらいなら
          # 余分にデプロイする(どちらも冪等)
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "前回の main tip を特定できないため両方デプロイする (before=${BEFORE})"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "ogp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "${BEFORE}" "${AFTER}")
          echo "変更ファイル:"
          echo "${changed}" | sed 's/^/  /'

          # 両方に効く土台。ロックファイルや tsconfig の変更はビルド結果を変えうる
          shared='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|package\.json|\.github/workflows/ci\.yml|tools/verify-.*\.mjs)$'
          # workers/ogp は packages/core に依存していない(deps は workers-og だけ)ので
          # core の変更で Worker を出し直す必要は無い
          web='^(apps/web/|packages/core/)'
          ogp='^workers/ogp/'

          # パイプにしないこと: `grep -q` は一致した時点で終了するので、書き手が SIGPIPE で
          # 死ぬと pipefail のせいで「一致したのに失敗」になりうる
          matches() { grep -qE "$1" <<< "${changed}"; }

          if matches "${web}" || matches "${shared}"; then web=true; else web=false; fi
          if matches "${ogp}" || matches "${shared}"; then ogp=true; else ogp=false; fi

          echo "→ web=${web} ogp=${ogp}"
          echo "web=${web}" >> "$GITHUB_OUTPUT"
          echo "ogp=${ogp}" >> "$GITHUB_OUTPUT"

  deploy-web:
    needs: [test, changes]
    # needs.changes が push 限定なので実質 main への push だけだが、
    # デプロイの門番は条件側にも明示しておく(fork の PR から絶対に走らせない)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # 同時デプロイで新旧が入れ替わるのを防ぐ。途中キャンセルは
      # 中途半端な状態を作るので cancel-in-progress は false
      group: deploy-web
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # account ID はクレデンシャルではなく識別子で、zone_id と同様に既にリポジトリへ
      # コミットされている(workers/ogp/wrangler.toml、tasks/todo.md)。secret にすると
      # GitHub がこの文字列をログ全体でマスクし、wrangler の出力が読みにくくなるだけなので平文で置く
      CLOUDFLARE_ACCOUNT_ID: 5ee49b8e0983dc8fcf6d0eddb45ef5d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # test ジョブが上げたものを使う(ここでは build し直さない)
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist

      # concurrency は同時実行を防ぐだけで**順序は保証しない**。連続でマージすると、
      # 後発の run が先に配信し、その後で先発の run が古い dist を上書きしうる
      # (しかも verify は自分の artifact と比べるので緑になる)。デプロイ直前に
      # 自分が main の tip かを確認して、追い抜かれていたら何もしない。
      # gh api を使うのは persist-credentials: false でも動かすため
      - id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [ "${tip}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main は既に ${tip} まで進んでいる。この run(${GITHUB_SHA})はデプロイしない"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # `pnpm deploy` は pnpm の組み込みコマンドなので、スクリプトを回すには run が要る
      - if: steps.tip.outputs.current == 'true'
        run: pnpm run deploy:web

      # 配信中の成果物 == いま出した成果物 を確定させる(伝播待ちのリトライ込み)
      - if: steps.tip.outputs.current == 'true'
        run: pnpm run verify:web

  deploy-ogp:
    needs: [test, changes]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.ogp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-ogp
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # account ID はクレデンシャルではなく識別子で、zone_id と同様に既にリポジトリへ
      # コミットされている(workers/ogp/wrangler.toml、tasks/todo.md)。secret にすると
      # GitHub がこの文字列をログ全体でマスクし、wrangler の出力が読みにくくなるだけなので平文で置く
      CLOUDFLARE_ACCOUNT_ID: 5ee49b8e0983dc8fcf6d0eddb45ef5d8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.30.3

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # concurrency は同時実行を防ぐだけで**順序は保証しない**。連続でマージすると、
      # 後発の run が先に配信し、その後で先発の run が古い dist を上書きしうる
      # (しかも verify は自分の artifact と比べるので緑になる)。デプロイ直前に
      # 自分が main の tip かを確認して、追い抜かれていたら何もしない。
      # gh api を使うのは persist-credentials: false でも動かすため
      - id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [ "${tip}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main は既に ${tip} まで進んでいる。この run(${GITHUB_SHA})はデプロイしない"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # Worker は wrangler が workers-og ごとバンドルするので、artifact ではなくソースから出す
      - if: steps.tip.outputs.current == 'true'
        run: pnpm run deploy:ogp

      - if: steps.tip.outputs.current == 'true'
        run: pnpm run verify:ogp
