<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="草崩し">
  <!--
    DESIGN-VISUAL §0 の配色規則をそのまま適用: 緑(GitHub の草スケール)はコンテンツ=ブロック、
    アンバー(--marquee)は操作系=ボール。1つ欠けたセルの位置にボールを置いて「崩している最中」を表す。
    16px でも読めるよう要素は 4 つまで。
  -->
  <rect width="32" height="32" rx="6" fill="#216e39"/>
  <rect x="6" y="6" width="9" height="9" rx="1.5" fill="#9be9a8"/>
  <rect x="17" y="6" width="9" height="9" rx="1.5" fill="#40c463"/>
  <rect x="6" y="17" width="9" height="9" rx="1.5" fill="#30a14e"/>
  <circle cx="21.5" cy="21.5" r="4.5" fill="#ffb224"/>
</svg>
