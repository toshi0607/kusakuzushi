  <!--
    ファビコンは 3 本立て。対応ブラウザは SVG を選ぶので .ico が余分に取得されることはない。

    index.html を 200 で返すため、置かないと /favicon.ico を叩いたクローラーが HTML を

  <!--
    フォント CSS は media="print" で読み込み、onload で all に戻す(= レンダーブロッキングにしない)。
    素の <link rel="stylesheet"> だと fonts.googleapis.com への往復が First Paint を止め、
    実測で LCP の 85% が Render Delay になっていた(tasks/todo.md セッション9)。
    どちらのフォントも display=swap なので、本文はフォールバックで即座に描画され後から差し替わる。

    DotGothic16 は表示ロール(タイトル/CTA/見出し/HUD/数字/クリアの煽り文)の
    固定グリフのみを text= でサブセット取得する(全glyphだと数百KB、subsetは数KB。
    煽り文 5 種を足して 70 → 126 字 = 4,940 → 8,684 バイト、2026-07-26 実測)。
    ここに無い文字を DotGothic で描くと Plex にフォールバックするので、
    表示ロールの文言を変えるときはこの text= も更新すること
    (煽り文については apps/web/src/font-subset.test.ts が自動で検出する)。
    data-font="display" は main.ts が「この CSS が来てから」canvas HUD 用に
    フォントをロードするための目印(@font-face 未登録で fonts.load しても何も起きない)。
  -->
  <link rel="stylesheet" data-font="display" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap&text=%E8%8D%89%E5%B4%A9%E3%81%97%E5%88%88%E3%82%8B%E5%AE%8C%E5%85%A8%E5%8F%96%E3%82%8A%EF%BC%81%E3%82%B2%E3%83%BC%E3%83%A0%E3%82%AA%E3%83%90%E7%94%BB%E5%83%8F%E3%82%92%E4%BF%9D%E5%AD%98%E3%82%82%E3%81%86%E4%B8%80%E5%9B%9EX%E3%81%A7%E5%85%B1%E6%9C%89%E3%82%AF%E3%83%AA%E3%83%83%E7%99%BA%E5%B0%84%E3%82%B9%E3%82%B3%E3%82%A2%E7%8E%87SpaceDEMOPLAYCRIF0123456789%25%2C%3A%2F.%20%E5%9C%B0%E9%81%93%E3%81%AB%E7%A9%8D%E3%81%BF%E4%B8%8A%E3%81%92%E3%81%A6%E3%81%8D%E3%81%9F%E3%81%AE%E3%81%8C%E3%82%8C%E5%8E%BB%E3%81%A3%E3%81%84%E3%81%8F%E6%B0%97%E5%88%86%E3%81%AF%E3%81%8B%E3%81%99%EF%BC%9F%E5%B9%B4%E3%81%B6%E3%82%93%E7%B2%BE%E9%80%B2%E3%80%81%E3%81%BE%E3%81%A8%E3%82%81%E6%9B%B4%E3%81%AA%E3%80%82%E6%AF%8E%E6%97%A5%E3%83%84%E7%B7%91%E6%B6%88%E3%81%88%E3%81%B2%E9%80%9A%E7%B5%82%E8%B7%A1%E5%BD%A2%E3%81%82%E3%81%9B%E3%81%93%E9%87%8F%E3%82%89%E6%9D%A5%E9%80%B1%E7%94%9F%E6%8F%83%E3%82%88">

<body>
  <!--
    ページシェル(見出し・ステージ枠・フッター)は静的 HTML で持つ。

    ここを JS で組み立てていた間、`#app` は空だったので First Contentful Paint は
    「HTML → CSS → module JS → JS 実行」の後ろに落ちていた。LCP 要素の
    p.subtitle も同じ鎖の先にあった。localhost 配信ではその往復がどれもほぼ 0ms
    なので `pnpm lh` では 100 点のまま見えず、実オリジンでだけ FCP/LCP が伸びる。

    ステージの中身(フォーム / ローディング / プレイ / リザルト)は従来どおり
    app.ts が入れる。**この markup を変えたら app.ts の findStage / セレクタと
    style.css の .stage min-height(下の高さ確保)も一緒に見直すこと。**
  -->
  <div id="app">
    <header class="site-header">
