<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GitHubの草(コントリビューショングラフ)をブロックに見立てて刈り取るブロック崩しゲーム">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F8F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C110D">
  <title>草崩し</title>
  <link rel="canonical" href="https://kusakuzushi.toshi0607.com/">
  <!--
    トップ URL 用の OGP。/share/{user} の動的カードは Worker(workers/ogp)が返すが、
    こちらは静的な既定カード(tools/og-card.html で生成した public/og.png)。
    og:image は絶対 URL でないと Slack/X が解決できない。width/height を明示すると
    画像を取りに行く前に large card レイアウトが確定する。
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="草崩し">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="草崩し">
  <meta property="og:description" content="GitHubの草(コントリビューショングラフ)をブロックに見立てて刈り取るブロック崩しゲーム">
  <meta property="og:url" content="https://kusakuzushi.toshi0607.com/">
  <meta property="og:image" content="https://kusakuzushi.toshi0607.com/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="草グラフに KUSAKUZUSHI と描かれたデモ盤面と、草崩しのロゴ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="草崩し">
  <meta name="twitter:description" content="GitHubの草(コントリビューショングラフ)をブロックに見立てて刈り取るブロック崩しゲーム">
  <meta name="twitter:image" content="https://kusakuzushi.toshi0607.com/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    DotGothic16 は表示ロール(タイトル/CTA/見出し/HUD/数字)の固定グリフのみを
    text= でサブセット取得する(全glyphだと数百KB、subsetは数KB)。
    ここに無い文字を DotGothic で描くと Plex にフォールバックするので、
    表示ロールの文言を変えるときはこの text= も更新すること。
  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap&text=%E8%8D%89%E5%B4%A9%E3%81%97%E5%88%88%E3%82%8B%E5%AE%8C%E5%85%A8%E5%8F%96%E3%82%8A%EF%BC%81%E3%82%B2%E3%83%BC%E3%83%A0%E3%82%AA%E3%83%90%E7%94%BB%E5%83%8F%E3%82%92%E4%BF%9D%E5%AD%98%E3%82%82%E3%81%86%E4%B8%80%E5%9B%9EX%E3%81%A7%E5%85%B1%E6%9C%89%E3%82%AF%E3%83%AA%E3%83%83%E7%99%BA%E5%B0%84%E3%82%B9%E3%82%B3%E3%82%A2%E7%8E%87SpaceDEMOPLAYCRIF0123456789%25%2C%3A%2F.%20">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
</head>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
