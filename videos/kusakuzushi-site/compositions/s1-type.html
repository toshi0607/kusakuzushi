<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>S1 — 名前を打つだけ</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      @font-face {
        font-family: "DotGothic16";
        src: url("assets/fonts/DotGothic16-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-SemiBold.ttf") format("truetype");
        font-weight: 600; font-style: normal; font-display: block;
      }
      html, body { width:100%; height:100%; background:#0C110D; overflow:hidden; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0C110D; color:#E4EDE2; font-family:"IBM Plex Sans JP", sans-serif; }
      .clip { position:absolute; }
      .board { top:338px; left:0; width:1080px; height:405px; }
      .hook-scene { inset:0; width:100%; height:100%; overflow:hidden; background:#0C110D; }
      .site-crop { position:absolute; inset:0; overflow:hidden; }
      .site-crop > img { position:absolute; left:-1812.5px; top:-1315.875px; width:4704px; height:2646px; }
      .site-url { position:absolute; top:150px; left:0; width:100%; text-align:center; color:#8DA08C; font-size:28px; }
      .input-cover { position:absolute; left:34px; top:490px; width:736px; height:96px; background:#121913; opacity:0; }
      .typed-name { position:absolute; left:64px; top:516px; color:#E4EDE2; font-size:34px; line-height:1.3; opacity:0; }
      .caret { position:absolute; left:106px; top:542px; width:3px; height:48px; background:#E4EDE2; }
      .button-backdrop { position:absolute; left:789px; top:511px; width:274px; height:131px; background:#0C110D; }
      .button-crop { position:absolute; left:797.5px; top:482.425px; width:257.25px; height:112.7px; overflow:hidden; transform-origin:center; }
      .button-crop > img { position:absolute; left:-2610px; top:-1798.3px; width:4704px; height:2646px; }
      .reveal-heading { top:190px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:58px; line-height:1.2; color:#E4EDE2; }
      .reveal-line { top:790px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:52px; line-height:1.2; color:#E4EDE2; }
      .block-label { top:872px; left:0; width:100%; text-align:center; font-family:"DotGothic16", monospace; font-size:24px; color:#8DA08C; font-variant-numeric:tabular-nums; }
      .rate-box { top:132px; right:76px; width:300px; text-align:right; }
      .rate-label { position:absolute; top:0; right:0; width:100%; font-family:"DotGothic16", sans-serif; font-size:24px; color:#8DA08C; }
      .rate-value { position:absolute; top:140px; right:0; width:100%; font-family:"DotGothic16", sans-serif; font-size:100px; line-height:1; color:#FFB224; font-variant-numeric:tabular-nums; }
      .result-text { top:790px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:72px; color:#FFB224; font-variant-numeric:tabular-nums; }
.endcard {
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: #0C110D;
}
.endcard-title { font-family: "DotGothic16", sans-serif; font-size: 160px; line-height: 1; color: #E4EDE2; }
.endcard-url { font-family: "IBM Plex Sans JP", sans-serif; font-weight: 400; font-size: 36px; color: #E4EDE2; }
.endcard-btn { font-family: "DotGothic16", sans-serif; font-size: 44px; color: #1A1206; background: #FFB224; padding: 20px 48px; border-radius: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s1-type" data-start="0" data-width="1080" data-height="1080" data-duration="24.0" data-fps="60">
      <div class="clip hook-scene" id="s1-hook-scene" data-start="0.0" data-duration="6.0">
        <div class="site-crop">
          <img id="s1-site-image" src="assets/clips/site-top.png" alt="" data-layout-allow-overflow />
        </div>
        <div class="site-url">kusakuzushi.toshi0607.com</div>
        <div class="input-cover" id="s1-input-cover"></div>
        <div class="typed-name" id="s1-typed-name"></div>
        <div class="caret" id="s1-caret"></div>
        <div class="button-backdrop" id="s1-button-backdrop"></div>
        <div class="button-crop" id="s1-button">
          <img id="s1-button-image" src="assets/clips/site-top.png" alt="" data-layout-allow-overflow />
        </div>
      </div>

      <div class="clip reveal-heading" id="s1-reveal-heading" data-start="6.0" data-duration="2.0">あなたの 1 年分の草が、</div>
      <img class="clip board" id="s1-intact-still" data-start="6.0" data-duration="2.0" src="assets/clips/take-a-intact.png" alt="" />
      <div class="clip reveal-line" id="s1-reveal-line" data-start="7.0" data-duration="1.0">そのまま盤面になる。</div>
      <div class="clip block-label" id="s1-block-label" data-start="7.0" data-duration="1.0">370 ブロック</div>

      <video class="clip board" id="s1-ramp-video" data-start="8.0" data-duration="10.0" src="assets/clips/a-ramp.mp4" muted playsinline></video>
      <div class="clip rate-box" id="s1-rate-box" data-start="8.0" data-duration="10.0">
        <div class="rate-label">刈り取り率</div>
        <div class="rate-value" id="s1-rate-value">0%</div>
      </div>

      <img class="clip board" id="s1-empty-still" data-start="18.0" data-duration="2.0" src="assets/clips/take-a-empty.png" alt="" />
      <div class="clip result-text" id="s1-result-text" data-start="18.0" data-duration="2.0">刈り取り率 100%</div>

<!-- endcard -->
<div class="clip endcard" id="endcard" data-start="20.0" data-duration="4.0" data-track-index="90">
  <div class="endcard-title">草崩し</div>
  <div class="endcard-url">kusakuzushi.toshi0607.com</div>
  <div class="endcard-btn">草を刈る</div>
</div>
<!-- /endcard -->
    </div>
    <script>
      (function () {
        const aRampSeries = [{u:0,pct:0},{u:0.1,pct:0},{u:0.2,pct:0},{u:0.3,pct:0},{u:0.4,pct:0},{u:0.5,pct:0},{u:0.6,pct:0},{u:0.7,pct:0},{u:0.8,pct:0},{u:0.9,pct:1},{u:1,pct:1},{u:1.1,pct:1},{u:1.2,pct:1},{u:1.3,pct:1},{u:1.4,pct:1},{u:1.5,pct:1},{u:1.6,pct:1},{u:1.7,pct:1},{u:1.8,pct:2},{u:1.9,pct:2},{u:2,pct:2},{u:2.1,pct:2},{u:2.2,pct:2},{u:2.3,pct:2},{u:2.4,pct:2},{u:2.5,pct:2},{u:2.6,pct:2},{u:2.7,pct:3},{u:2.8,pct:3},{u:2.9,pct:3},{u:3,pct:3},{u:3.1,pct:3},{u:3.2,pct:3},{u:3.3,pct:3},{u:3.4,pct:4},{u:3.5,pct:4},{u:3.6,pct:4},{u:3.7,pct:4},{u:3.8,pct:7},{u:3.9,pct:7},{u:4,pct:7},{u:4.1,pct:7},{u:4.2,pct:8},{u:4.3,pct:8},{u:4.4,pct:8},{u:4.5,pct:8},{u:4.6,pct:8},{u:4.7,pct:8},{u:4.8,pct:8},{u:4.9,pct:8},{u:5,pct:8},{u:5.1,pct:9},{u:5.2,pct:9},{u:5.3,pct:13},{u:5.4,pct:15},{u:5.5,pct:16},{u:5.6,pct:18},{u:5.7,pct:19},{u:5.8,pct:20},{u:5.9,pct:22},{u:6,pct:23},{u:6.1,pct:23},{u:6.2,pct:23},{u:6.3,pct:24},{u:6.4,pct:24},{u:6.5,pct:25},{u:6.6,pct:25},{u:6.7,pct:26},{u:6.8,pct:41},{u:6.9,pct:47},{u:7,pct:54},{u:7.1,pct:57},{u:7.2,pct:59},{u:7.3,pct:62},{u:7.4,pct:66},{u:7.5,pct:69},{u:7.6,pct:72},{u:7.7,pct:76},{u:7.8,pct:78},{u:7.9,pct:81},{u:8,pct:89},{u:8.1,pct:94},{u:8.2,pct:96},{u:8.3,pct:97},{u:8.4,pct:99},{u:8.5,pct:100},{u:8.6,pct:100},{u:8.7,pct:100},{u:8.8,pct:100},{u:8.9,pct:100},{u:9,pct:100},{u:9.1,pct:100},{u:9.2,pct:100},{u:9.3,pct:100},{u:9.4,pct:100},{u:9.5,pct:100},{u:9.6,pct:100},{u:9.7,pct:100},{u:9.8,pct:100},{u:9.9,pct:100},{u:10,pct:100}];
        function seriesAt(series, u) {
          const idx = Math.max(0, Math.min(series.length - 1, Math.round(u * 10)));
          return series[idx];
        }

        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s1-caret", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "steps(1)", repeat: Math.max(0, Math.floor(3.5 / 0.5) - 1) }, 0.0);
        tl.set("#s1-caret", { opacity: 0 }, 3.5);
        tl.set("#s1-input-cover, #s1-typed-name", { opacity: 1 }, 3.5);
        for (let i = 0; i < 9; i += 1) {
          tl.set("#s1-typed-name", { textContent: "toshi0607".slice(0, i + 1) }, 3.5 + i * 0.12);
        }
        tl.fromTo("#s1-button", {scale:0.94}, {scale:1, duration:0.15, ease:"power3.out"}, 5.6);
        tl.set("#s1-reveal-heading, #s1-intact-still", { opacity: 1 }, 6.0);
        tl.set("#s1-reveal-line, #s1-block-label", { opacity: 1 }, 7.0);

        const counterState = { u: 0 };
        tl.to(counterState, {
          u: 10.0,
          duration: 10.0,
          ease: "none",
          onUpdate: () => {
            document.getElementById("s1-rate-value").textContent = seriesAt(aRampSeries, counterState.u).pct + "%";
          }
        }, 8.0);
        tl.set("#s1-empty-still, #s1-result-text", { opacity: 1 }, 18.0);
tl.fromTo("#endcard .endcard-title", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 20.0 + 0.0);
tl.fromTo("#endcard .endcard-url",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 20.0 + 0.15);
tl.fromTo("#endcard .endcard-btn",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 20.0 + 0.3);
        tl.seek(0);
        window.__timelines["s1-type"] = tl;
      })();
    </script>
  </body>
</html>
