<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>S6 — ピークから始める</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      @font-face {
        font-family: "DotGothic16";
        src: url("assets/fonts/DotGothic16-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-SemiBold.ttf") format("truetype");
        font-weight: 600; font-style: normal; font-display: block;
      }
      html, body { width:100%; height:100%; background:#0C110D; overflow:hidden; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0C110D; font-family:"IBM Plex Sans JP", sans-serif; }
      .clip { position:absolute; }
      .board {
        top: 338px;
        left: 0;
        width: 1080px;
        height: 405px;
      }
      .peak-caption {
        top: 150px;
        left: 0;
        width: 100%;
        font-family: "DotGothic16", sans-serif;
        font-size: 64px;
        line-height: 1;
        color: #E4EDE2;
        text-align: center;
      }
.endcard {
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: #0C110D;
}
.endcard-title {
  font-family: "DotGothic16", sans-serif;
  font-size: 160px;
  line-height: 1;
  color: #E4EDE2;
}
.endcard-url {
  font-family: "IBM Plex Sans JP", sans-serif;
  font-weight: 400;
  font-size: 36px;
  color: #E4EDE2;
}
.endcard-btn {
  font-family: "DotGothic16", sans-serif;
  font-size: 44px;
  color: #1A1206;
  background: #FFB224;
  padding: 20px 48px;
  border-radius: 0;
}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s6-peak" data-start="0" data-width="1080" data-height="1080" data-duration="11.5" data-fps="60">
      <video class="clip board" id="s6-video" data-start="0" data-duration="7.08" src="assets/clips/a-peak.mp4" muted playsinline></video>
      <img class="clip board" id="s6-empty-still" data-start="7.08" data-duration="0.42" src="assets/clips/take-a-empty.png" alt="" />
      <div class="clip peak-caption" id="s6-caption" data-start="0" data-duration="7.5">GitHub の草で、ブロック崩し。</div>

<!-- endcard -->
<div class="clip endcard" id="endcard" data-start="7.5" data-duration="4.0" data-track-index="90">
  <div class="endcard-title">草崩し</div>
  <div class="endcard-url">kusakuzushi.toshi0607.com</div>
  <div class="endcard-btn">草を刈る</div>
</div>
<!-- /endcard -->
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
tl.fromTo("#endcard .endcard-title", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 7.5 + 0.0);
tl.fromTo("#endcard .endcard-url",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 7.5 + 0.15);
tl.fromTo("#endcard .endcard-btn",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 7.5 + 0.3);
        tl.seek(0);
        window.__timelines["s6-peak"] = tl;
      })();
    </script>
  </body>
</html>
