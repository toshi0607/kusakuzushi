<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>S10 — 画面録画</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      @font-face {
        font-family: "DotGothic16";
        src: url("assets/fonts/DotGothic16-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-SemiBold.ttf") format("truetype");
        font-weight: 600; font-style: normal; font-display: block;
      }
      html, body { width:100%; height:100%; background:#0C110D; overflow:hidden; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0C110D; font-family:"IBM Plex Sans JP", sans-serif; }
      .clip { position:absolute; }
      #camera {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      .site-shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #s10-gameplay-crop {
        position: absolute;
        left: 441px;
        top: 367.46875px;
        width: 1038px;
        height: 389.25px;
        border-radius: 7px;
        overflow: hidden;
      }
      #s10-reveal-crop {
        position: absolute;
        left: 441px;
        top: 367.46875px;
        width: 1038px;
        height: 150px;
        border-radius: 7px 7px 0 0;
        overflow: hidden;
      }
      #s10-cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 24px;
        height: 24px;
      }
      #s10-cursor svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 22px;
        height: 22px;
        overflow: visible;
      }
.endcard {
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: #0C110D;
}
.endcard-title {
  font-family: "DotGothic16", sans-serif;
  font-size: 160px;
  line-height: 1;
  color: #E4EDE2;
}
.endcard-url {
  font-family: "IBM Plex Sans JP", sans-serif;
  font-weight: 400;
  font-size: 36px;
  color: #E4EDE2;
}
.endcard-btn {
  font-family: "DotGothic16", sans-serif;
  font-size: 44px;
  color: #1A1206;
  background: #FFB224;
  padding: 20px 48px;
  border-radius: 0;
}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s10-screen" data-start="0" data-width="1080" data-height="1080" data-duration="14" data-fps="60">
      <div id="camera" data-layout-allow-overflow>
        <img id="s10-page-playing" class="clip site-shot" src="assets/clips/site/playing.png" alt="" data-start="0.0" data-duration="3.0" />
        <img id="s10-page-form-idle" class="clip site-shot" src="assets/clips/site/form-idle.png" alt="" data-start="3.0" data-duration="0.35" />
        <img id="s10-page-type-00" class="clip site-shot" src="assets/clips/site/type-00.png" alt="" data-start="3.35" data-duration="0.10" />
        <img id="s10-page-type-01" class="clip site-shot" src="assets/clips/site/type-01.png" alt="" data-start="3.45" data-duration="0.10" />
        <img id="s10-page-type-02" class="clip site-shot" src="assets/clips/site/type-02.png" alt="" data-start="3.55" data-duration="0.10" />
        <img id="s10-page-type-03" class="clip site-shot" src="assets/clips/site/type-03.png" alt="" data-start="3.65" data-duration="0.10" />
        <img id="s10-page-type-04" class="clip site-shot" src="assets/clips/site/type-04.png" alt="" data-start="3.75" data-duration="0.10" />
        <img id="s10-page-type-05" class="clip site-shot" src="assets/clips/site/type-05.png" alt="" data-start="3.85" data-duration="0.10" />
        <img id="s10-page-type-06" class="clip site-shot" src="assets/clips/site/type-06.png" alt="" data-start="3.95" data-duration="0.10" />
        <img id="s10-page-type-07" class="clip site-shot" src="assets/clips/site/type-07.png" alt="" data-start="4.05" data-duration="0.10" />
        <img id="s10-page-type-08" class="clip site-shot" src="assets/clips/site/type-08.png" alt="" data-start="4.15" data-duration="0.10" />
        <img id="s10-page-type-09" class="clip site-shot" src="assets/clips/site/type-09.png" alt="" data-start="4.25" data-duration="0.60" />
        <img id="s10-page-button-hover" class="clip site-shot" src="assets/clips/site/button-hover.png" alt="" data-start="4.85" data-duration="0.25" />
        <img id="s10-page-button-active" class="clip site-shot" src="assets/clips/site/button-active.png" alt="" data-start="5.1" data-duration="0.40" />
        <img id="s10-page-ready" class="clip site-shot" src="assets/clips/site/ready.png" alt="" data-start="5.5" data-duration="4.5" />

        <div id="s10-gameplay-crop">
          <video id="s10-peak-video" src="assets/clips/c-peak.mp4" data-start="0.0" data-duration="3.0" muted playsinline style="position:absolute; left:0; top:0; width:100%; height:100%; object-fit:fill;"></video>
          <video id="s10-play-video" src="assets/clips/c-play.mp4" data-start="6.8" data-duration="3.2" muted playsinline style="position:absolute; left:0; top:0; width:100%; height:100%; object-fit:fill;"></video>
        </div>

        <div id="s10-reveal-crop">
          <video id="s10-reveal-video" src="assets/clips/take-a-site-reveal.mp4" data-start="5.5" data-duration="1.2" muted playsinline style="position:absolute; left:0; top:0; width:1038px; height:389.25px; object-fit:fill;"></video>
        </div>

        <div id="s10-cursor" aria-hidden="true">
          <svg id="s10-cursor-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 1.5 L2 19.5 L7 14.7 L10.6 22 L14 20.3 L10.4 13 L18 13 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="miter" />
          </svg>
          <svg id="s10-cursor-ibeam" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 2 H19 V5 H14 V19 H19 V22 H5 V19 H10 V5 H5 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="miter" />
          </svg>
          <svg id="s10-cursor-pointer" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 2 H12 V10 L14 8 H17 V11 L19 10 L22 12 V17 L19 22 H10 L5 16 V13 H8 L9 14 Z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="miter" />
          </svg>
        </div>
      </div>

<!-- endcard -->
<div class="clip endcard" id="endcard" data-start="10.0" data-duration="4.0" data-track-index="90">
  <div class="endcard-title">草崩し</div>
  <div class="endcard-url">kusakuzushi.toshi0607.com</div>
  <div class="endcard-btn">草を刈る</div>
</div>
<!-- /endcard -->
    </div>
    <script>
      (function () {
        gsap.set("#camera", {x:-420, y:-22, scale:1.0, transformOrigin:"0 0"});
        gsap.set("#s10-cursor", {x:1040, y:850, opacity:0});
        gsap.set("#s10-cursor-arrow", {opacity:1});
        gsap.set("#s10-cursor-ibeam", {opacity:0});
        gsap.set("#s10-cursor-pointer", {opacity:0});

        const tl = gsap.timeline({ paused: true });

        // Two states only (reference video): base 1.0 and one zoom per interaction.
        tl.to("#camera", {x:-1380, y:-974, scale:2.0, duration:0.45, ease:"power2.out"}, 3.35);
        tl.to("#camera", {x:-420, y:-22, scale:1.0, duration:0.5, ease:"power2.inOut"}, 5.1);

        tl.set("#s10-cursor", {opacity:1}, 3.0);
        tl.to("#s10-cursor", {x:800, y:757, duration:0.28, ease:"power2.inOut"}, 3.0);
        tl.set("#s10-cursor-arrow", {opacity:0}, 3.35);
        tl.set("#s10-cursor-ibeam", {opacity:1}, 3.35);
        tl.fromTo("#s10-cursor", {scale:0.85}, {scale:1, duration:0.12, ease:"power2.out"}, 3.35);
        // macOS hides the pointer while typing
        tl.set("#s10-cursor", {opacity:0}, 3.45);
        tl.set("#s10-cursor", {opacity:1}, 4.5);
        tl.to("#s10-cursor", {x:1117.7, y:757, duration:0.35, ease:"power2.inOut"}, 4.5);
        // pointer hand once the cursor crosses the input's right edge (x≈1057)
        tl.set("#s10-cursor-ibeam", {opacity:0}, 4.74);
        tl.set("#s10-cursor-pointer", {opacity:1}, 4.74);
        tl.fromTo("#s10-cursor", {scale:0.85}, {scale:1, duration:0.12, ease:"power2.out"}, 5.1);
        tl.to("#s10-cursor", {x:960, y:700, duration:0.4, ease:"power2.inOut"}, 6.25);
        tl.fromTo("#s10-cursor", {scale:0.85}, {scale:1, duration:0.12, ease:"power2.out"}, 6.8);
        tl.to("#s10-cursor", {opacity:0, duration:0.3, ease:"none"}, 6.85);

tl.fromTo("#endcard .endcard-title", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.0 + 0.0);
tl.fromTo("#endcard .endcard-url",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.0 + 0.15);
tl.fromTo("#endcard .endcard-btn",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.0 + 0.3);
        tl.seek(0);
        window.__timelines["s10-screen"] = tl;
      })();
    </script>
  </body>
</html>
