<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>S5 — 1 マスの物語</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      @font-face {
        font-family: "DotGothic16";
        src: url("assets/fonts/DotGothic16-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-SemiBold.ttf") format("truetype");
        font-weight: 600; font-style: normal; font-display: block;
      }
      html, body { width:100%; height:100%; background:#0C110D; overflow:hidden; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0C110D; color:#E4EDE2; font-family:"IBM Plex Sans JP", sans-serif; }
      .clip { position:absolute; }
      .board { top:338px; left:0; width:1080px; height:405px; }
      .hook-heading { top:156px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:54px; color:#E4EDE2; }
      .hook-cell { left:260px; top:260px; width:560px; height:560px; background:#0e4429; }
      .cell-caption { top:858px; left:0; width:100%; text-align:center; font-family:"DotGothic16", monospace; font-size:24px; color:#8DA08C; font-variant-numeric:tabular-nums; }
      .ball { left:520px; top:1150px; width:40px; height:40px; background:#FFB224; border-radius:50%; }
      .pullback-container { left:0; top:0; width:1920px; height:720px; transform-origin:0 0; }
      .pullback-container > img { display:block; }
      .cell-cover { position:absolute; left:946px; top:224px; width:28px; height:28px; background:#0C110D; }
      .line-text { top:800px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:66px; color:#E4EDE2; }
.endcard {
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: #0C110D;
}
.endcard-title { font-family: "DotGothic16", sans-serif; font-size: 160px; line-height: 1; color: #E4EDE2; }
.endcard-url { font-family: "IBM Plex Sans JP", sans-serif; font-weight: 400; font-size: 36px; color: #E4EDE2; }
.endcard-btn { font-family: "DotGothic16", sans-serif; font-size: 44px; color: #1A1206; background: #FFB224; padding: 20px 48px; border-radius: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s5-onecell" data-start="0" data-width="1080" data-height="1080" data-duration="23.5" data-fps="60">
      <div class="clip hook-heading" id="s5-hook-heading" data-start="0.0" data-duration="5.0">ある日の、あなたの草。</div>
      <div class="clip hook-cell" id="s5-hook-cell" data-start="0.0" data-duration="5.0"></div>
      <div class="clip cell-caption" id="s5-cell-caption" data-start="0.0" data-duration="5.0">2026-03-28 · 1 contribution</div>
      <div class="clip ball" id="s5-ball" data-start="4.0" data-duration="1.0"></div>

      <div class="clip pullback-container" id="s5-pullback-container" data-start="5.0" data-duration="3.0">
        <img id="s5-pullback-img" src="assets/clips/take-a-intact.png" width="1920" height="720" alt="" />
        <div class="cell-cover" id="s5-cell-cover"></div>
      </div>

      <video class="clip board" id="s5-fromhit-video" data-start="8.0" data-duration="9.9" src="assets/clips/a-ramp-fromhit.mp4" muted playsinline></video>
      <img class="clip board" id="s5-empty-still" data-start="17.9" data-duration="1.6" src="assets/clips/take-a-empty.png" alt="" />
      <div class="clip line-text" id="s5-line-text" data-start="17.9" data-duration="1.6">365 日ぶん、崩せる。</div>

<!-- endcard -->
<div class="clip endcard" id="endcard" data-start="19.5" data-duration="4.0" data-track-index="90">
  <div class="endcard-title">草崩し</div>
  <div class="endcard-url">kusakuzushi.toshi0607.com</div>
  <div class="endcard-btn">草を刈る</div>
</div>
<!-- /endcard -->
    </div>
    <script>
      (function () {
        gsap.set("#s5-pullback-container", { x: -18660, y: -4220, scale: 20 });
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s5-hook-heading", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.0);
        tl.fromTo("#s5-cell-caption", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.8);
        tl.fromTo("#s5-ball", { y: 0 }, { y: -350, duration: 0.5, ease: "power2.in" }, 4.0);
        tl.to("#s5-ball", { y: -300, duration: 0.5, ease: "power2.out" }, 4.5);
        tl.set("#s5-hook-cell", { backgroundColor: "transparent", border: "1px solid #28332A" }, 4.5);
        tl.to("#s5-pullback-container", { x: 0, y: 338, scale: 0.5625, duration: 3.0, ease: "power3.out" }, 5.0);
        tl.set("#s5-empty-still, #s5-line-text", { opacity: 1 }, 17.9);
tl.fromTo("#endcard .endcard-title", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 19.5 + 0.0);
tl.fromTo("#endcard .endcard-url",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 19.5 + 0.15);
tl.fromTo("#endcard .endcard-btn",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 19.5 + 0.3);
        tl.seek(0);
        window.__timelines["s5-onecell"] = tl;
      })();
    </script>
  </body>
</html>
