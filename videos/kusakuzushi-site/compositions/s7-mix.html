<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>S7 — ピークと入力</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      @font-face {
        font-family: "DotGothic16";
        src: url("assets/fonts/DotGothic16-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-Regular.ttf") format("truetype");
        font-weight: 400; font-style: normal; font-display: block;
      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-SemiBold.ttf") format("truetype");
        font-weight: 600; font-style: normal; font-display: block;
      }
      html, body { width:100%; height:100%; background:#0C110D; overflow:hidden; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0C110D; font-family:"IBM Plex Sans JP", sans-serif; }
      .clip { position:absolute; }
      .board {
        top: 338px;
        left: 0;
        width: 1080px;
        height: 405px;
      }
      .peak-caption {
        top: 150px;
        left: 0;
        width: 100%;
        font-family: "DotGothic16", sans-serif;
        font-size: 64px;
        line-height: 1;
        color: #E4EDE2;
        text-align: center;
      }
      .hook-scene { inset:0; width:100%; height:100%; overflow:hidden; background:#0C110D; }
      .site-crop { position:absolute; inset:0; overflow:hidden; }
      .site-crop > img { position:absolute; left:-1812.5px; top:-1315.875px; width:4704px; height:2646px; }
      .input-cover { position:absolute; left:34px; top:490px; width:736px; height:96px; background:#121913; opacity:0; }
      .typed-name { position:absolute; left:64px; top:516px; color:#E4EDE2; font-size:34px; line-height:1.3; opacity:0; }
      .caret { position:absolute; left:106px; top:542px; width:3px; height:48px; background:#E4EDE2; }
      .button-backdrop { position:absolute; left:789px; top:474px; width:274px; height:130px; background:#0C110D; }
      .button-crop { position:absolute; left:797.5px; top:482.425px; width:257.25px; height:112.7px; overflow:hidden; transform-origin:center; }
      .button-crop > img { position:absolute; left:-2610px; top:-1798.3px; width:4704px; height:2646px; }
      .reveal-heading { top:190px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:58px; line-height:1.2; color:#E4EDE2; }
      .reveal-line { top:790px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:52px; line-height:1.2; color:#E4EDE2; }
.endcard {
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: #0C110D;
}
.endcard-title {
  font-family: "DotGothic16", sans-serif;
  font-size: 160px;
  line-height: 1;
  color: #E4EDE2;
}
.endcard-url {
  font-family: "IBM Plex Sans JP", sans-serif;
  font-weight: 400;
  font-size: 36px;
  color: #E4EDE2;
}
.endcard-btn {
  font-family: "DotGothic16", sans-serif;
  font-size: 44px;
  color: #1A1206;
  background: #FFB224;
  padding: 20px 48px;
  border-radius: 0;
}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s7-mix" data-start="0" data-width="1080" data-height="1080" data-duration="14" data-fps="60">
      <video id="s7-peak-video" class="clip board" data-start="0" data-duration="3.0" data-media-start="1.3" src="assets/clips/a-peak.mp4" muted playsinline></video>
      <div class="clip peak-caption" data-start="0" data-duration="3.0">GitHub の草で、ブロック崩し。</div>

      <div class="clip hook-scene" id="s1-hook-scene" data-start="3.0" data-duration="3.0">
        <div class="site-crop">
          <img id="s1-site-image" src="assets/clips/site-top.png" alt="" data-layout-allow-overflow />
        </div>
        <div class="input-cover" id="s1-input-cover"></div>
        <div class="typed-name" id="s1-typed-name"></div>
        <div class="caret" id="s1-caret"></div>
        <div class="button-backdrop" id="s1-button-backdrop"></div>
        <div class="button-crop" id="s1-button">
          <img id="s1-button-image" src="assets/clips/site-top.png" alt="" data-layout-allow-overflow />
        </div>
      </div>
      <div class="clip peak-caption" data-start="3.0" data-duration="3.0">あなたの草で。</div>

      <img class="clip board" data-start="6.0" data-duration="1.0" src="assets/clips/take-a-intact.png" alt="">
      <video id="s7-ramp-video" class="clip board" data-start="7.0" data-duration="3.0" src="assets/clips/a-ramp.mp4" muted playsinline></video>
      <div class="clip reveal-heading" data-start="6.0" data-duration="4.0">あなたの 1 年分の草が、</div>
      <div class="clip reveal-line" data-start="6.6" data-duration="3.4">そのまま盤面になる。</div>

<!-- endcard -->
<div class="clip endcard" id="endcard" data-start="10.0" data-duration="4.0" data-track-index="90">
  <div class="endcard-title">草崩し</div>
  <div class="endcard-url">kusakuzushi.toshi0607.com</div>
  <div class="endcard-btn">草を刈る</div>
</div>
<!-- /endcard -->
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s1-caret", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "steps(1)", repeat: 2 }, 3.0);
        tl.set("#s1-caret", { opacity: 0 }, 3.3);
        tl.set("#s1-input-cover, #s1-typed-name", { opacity: 1 }, 3.3);
        for (let i = 0; i < 9; i += 1) {
          tl.set("#s1-typed-name", { textContent: "toshi0607".slice(0, i + 1) }, 3.3 + i * 0.1);
        }
        tl.to("#s1-button", {scale:0.94, duration:0.08, ease:"power2.out"}, 5.2);
        tl.to("#s1-button", {scale:1, duration:0.25, ease:"power3.out"}, 5.28);
tl.fromTo("#endcard .endcard-title", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.0 + 0.0);
tl.fromTo("#endcard .endcard-url",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.0 + 0.15);
tl.fromTo("#endcard .endcard-btn",   { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.0 + 0.3);
        tl.seek(0);
        window.__timelines["s7-mix"] = tl;
      })();
    </script>
  </body>
</html>
