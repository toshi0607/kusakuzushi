<!doctype html>
<html lang="ja">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      @font-face {
        font-family: "DotGothic16";
        src: url("assets/fonts/DotGothic16-Regular.ttf") format("truetype");

      }
      @font-face {
        font-family: "IBM Plex Sans JP";

      }
      @font-face {
        font-family: "IBM Plex Sans JP";
        src: url("assets/fonts/IBMPlexSansJP-SemiBold.ttf") format("truetype");

      }
      html, body { width:100%; height:100%; background:#0C110D; overflow:hidden; }
      #root { position:relative; width:100%; height:100%; overflow:hidden; background:#0C110D; color:#E4EDE2; font-family:"IBM Plex Sans JP", sans-serif; }
      .clip { position:absolute; }
      .hook-line { left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:76px; line-height:1.25; color:#E4EDE2; }
      .hook-line-one { top:382px; }
      .hook-line-two { top:500px; color:#FFB224; }
      .panel { left:0; width:1080px; height:405px; }
      .panel-top { top:90px; }
      .panel-bottom { top:585px; }
      .panel-label { left:28px; z-index:2; font-family:"DotGothic16", sans-serif; font-size:26px; color:#8DA08C; background:#0C110D; padding:8px 12px; }
      .panel-label-top { top:40px; }
      .panel-label-bottom { top:531px; }
      .panel-readout { right:28px; z-index:2; width:190px; text-align:right; font-family:"DotGothic16", sans-serif; font-size:34px; color:#FFB224; background:#0C110D; padding:6px 12px; font-variant-numeric:tabular-nums; }
      .panel-readout-top { top:40px; }
      .panel-readout-bottom { top:531px; }
      .clear-label { left:0; z-index:2; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:68px; color:#FFB224; font-variant-numeric:tabular-nums; }
      .clear-top { top:270px; }
      .clear-bottom { top:765px; }
      .line-scene { inset:0; width:100%; height:100%; background:#0C110D; }
      .line-main { position:absolute; top:410px; left:60px; width:960px; text-align:center; font-family:"DotGothic16", sans-serif; font-size:66px; line-height:1.3; color:#E4EDE2; }
      .line-sub { position:absolute; top:570px; left:0; width:100%; text-align:center; font-family:"DotGothic16", sans-serif; font-size:34px; color:#8DA08C; font-variant-numeric:tabular-nums; }
.endcard {
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  background: #0C110D;
}
.endcard-title { font-family: "DotGothic16", sans-serif; font-size: 160px; line-height: 1; color: #E4EDE2; }
.endcard-url { font-family: "IBM Plex Sans JP", sans-serif; font-weight: 400; font-size: 36px; color: #E4EDE2; }
.endcard-btn { font-family: "DotGothic16", sans-serif; font-size: 44px; color: #1A1206; background: #FFB224; padding: 20px 48px; border-radius: 0; }

    <div id="root" data-composition-id="s2-race" data-start="0" data-width="1080" data-height="1080" data-duration="24.0" data-fps="60">
      <div class="clip hook-line hook-line-one" id="s2-hook-one" data-start="0.0" data-duration="3.0"><div id="s2-hook-one-inner">あなたの草は、</div></div>

        <div class="line-sub" id="s2-line-sub">最大 200 球 / 6 球</div>
      </div>
