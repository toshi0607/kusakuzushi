<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>kusakuzushi recording harness</title>
    <style>
      @font-face {
        font-family: "DotGothic16";
        src: url("./fonts/DotGothic16-Regular.ttf") format("truetype");
      }
      html, body { margin: 0; padding: 0; background: #0C110D; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <script type="module">
      import { Game, DEFAULT_CONFIG, DARK_THEME, render, toGrid } from "./core-bundle.js";

      // --- determinism -------------------------------------------------
      // The renderer's particle layer reads Date.now() and Math.random()
      // directly (packages/core/src/renderer.ts). Frames are advanced by the
      // recorder, not by rAF, so wall-clock time would drift between frames
      // and screenshots would show particles at arbitrary ages. A virtual
      // clock plus a seeded LCG makes every run byte-identical.
      let virtualMs = 1700000000000;
      Date.now = () => virtualMs;
      if (window.performance) window.performance.now = () => virtualMs;

      // --- parameters --------------------------------------------------
      const params = new URLSearchParams(window.location.search);
      const gridFile = params.get("grid") || "grid-a.json";
      const user = params.get("user") || "toshi0607";
      const seedParam = params.get("seed") || "20260727";
      const parsedSeed = Number(seedParam);
      if (!Number.isInteger(parsedSeed)) {
        throw new Error(`invalid seed: ${seedParam}`);
      }

      let seed = parsedSeed >>> 0;
      function rng() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      Math.random = rng;

      const themeParam = params.get("theme") === "site" ? "site" : "video";
      const hudParam = params.get("hud") === "1";
      const configParam = params.get("config") === "app" ? "app" : "video";
      const livesParam = params.get("lives");
      const lives = livesParam === null ? 9999 : Number(livesParam);
      if (!Number.isInteger(lives) || lives < 0) {
        throw new Error(`invalid lives: ${livesParam}`);
      }

      // --- grid --------------------------------------------------------
      const response = await fetch("./" + gridFile);
      if (!response.ok) throw new Error(`could not fetch grid: ${gridFile}`);
      const raw = await response.json();
      const grid = toGrid(user, raw.contributions);

      // --- stage -------------------------------------------------------
      // The engine's own geometry (960x360, 14px cells, 4px gaps) encodes the
      // real GitHub cell/gap ratio, so it stays untouched; only the backing
      // store is doubled so the capture has pixels to spare when the video
      // zooms into the grid.
      const SCALE = 2;
      const canvas = document.getElementById("stage");
      canvas.width = DEFAULT_CONFIG.canvasWidth * SCALE;
      canvas.height = DEFAULT_CONFIG.canvasHeight * SCALE;
      const ctx = canvas.getContext("2d");
      ctx.scale(SCALE, SCALE);

      // Green stays content-only (DESIGN-VISUAL.md): the ball and paddle are
      // chrome, so they take marquee amber and ink, never a grass green.
      //
      // colors[0] is both the level-0 cell and the canvas ground (renderer.ts
      // fills the whole canvas with it). Left at GitHub's #161b22 the footage
      // reads as a lighter rectangle pasted onto the video's #0C110D field —
      // a visible seam on every frame that carries the board. Repainting it to
      // the video's own ground welds the two together; the only thing lost is
      // the box around a zero-contribution day.
      //
      // theme=site skips all of that: it is exactly WEB_DARK_THEME
      // (apps/web/src/theme.ts) — GitHub's own #161b22 ground, unmodified
      // DARK_THEME paddle/ball/text colors, marquee-amber accent, and the
      // pixel HUD font — because this take is meant to look like the live
      // app's canvas, not the video's.
      const theme = themeParam === "site"
        ? {
            ...DARK_THEME,
            accentColor: "#FFB224",
            hudFont: '"DotGothic16", "IBM Plex Sans JP", sans-serif',
          }
        : {
            ...DARK_THEME,
            colors: ["#0C110D", ...DARK_THEME.colors.slice(1)],
            ballColor: "#FFB224",
            paddleColor: "#E4EDE2",
          };

      // config=video (default): tuned for the video, not for play — the item
      // rate is raised so multiball compounds, that compounding IS the
      // acceleration, produced by the real engine rather than faked in post.
      // config=app: no tuning at all, i.e. the engine's own DEFAULT_CONFIG —
      // the same numbers the web app plays with (apps/web/src/session.ts
      // calls `new Game(grid)` with zero overrides).
      // `lives` is a query param (default 9999, effectively infinite) so a
      // dropped ball never resets the board mid-take unless the caller opts
      // into a small number on purpose.
      const game = new Game(
        grid,
        configParam === "app"
          ? { lives, random: rng }
          : { lives, ballSpeed: 620, itemDropChance: 0.22, earlyItemDropBonus: 0.2, random: rng },
      );

      const TOTAL_CONTRIBUTIONS = game.liveBricks.reduce((sum, b) => sum + b.count, 0);
      const TOTAL_BRICKS = game.liveBricks.length;

      // --- autopilot (ported from apps/web/src/attract.ts) ---------------
      const LAUNCH_DELAY_MS = 500;
      const RELAUNCH_DELAY_MS = 900;
      const WOBBLE_AMPLITUDE_PX = 18;
      const WOBBLE_PERIOD_MS = 800;
      const AUTOPILOT_SPEED_PX_PER_SEC = 900;

      let paddleX = DEFAULT_CONFIG.canvasWidth / 2;
      let launchAtMs = virtualMs + LAUNCH_DELAY_MS;

      function trackedBallX() {
        let lowest = game.ballStates[0];
        for (const ball of game.ballStates) if (ball.y > lowest.y) lowest = ball;
        return lowest.x;
      }

      function autopilot(dt) {
        const wobble = Math.sin(virtualMs / WOBBLE_PERIOD_MS) * WOBBLE_AMPLITUDE_PX;
        const target = trackedBallX() + wobble;
        const maxStep = AUTOPILOT_SPEED_PX_PER_SEC * dt;
        paddleX += Math.min(Math.max(target - paddleX, -maxStep), maxStep);
        game.movePaddle(paddleX);
      }

      function draw(options) {
        // theme.colors[0] IS "#0C110D" for the default (video) theme, so this
        // is byte-identical to the old hardcoded fill for every existing take;
        // theme=site needs the real ground colour here instead.
        ctx.fillStyle = theme.colors[0];
        ctx.fillRect(0, 0, DEFAULT_CONFIG.canvasWidth, DEFAULT_CONFIG.canvasHeight);
        render(ctx, game, theme, { hud: hudParam, reveal: options?.reveal });
      }

      // --- recorder API -------------------------------------------------
      let lastHits = [];

      window.__drawReveal = function drawReveal(reveal) {
        draw({ reveal });
      };

      window.__advance = function advance(dtSec) {
        virtualMs += dtSec * 1000;

        if (game.state === "gameOver" || game.state === "clear") {
          lastHits = [];
          // The board is cleared, so the closing shot wants an empty field —
          // but core stops stepping physics once the state leaves "playing",
          // so balls in flight would freeze over the result. Drop them (and
          // any falling items) for the hold.
          game.ballStates.length = 0;
          game.itemStates.length = 0;
          draw();
          return;
        }
        if (game.state === "ready" || game.state === "ballLost") {
          if (launchAtMs === null) launchAtMs = virtualMs + RELAUNCH_DELAY_MS;
          else if (virtualMs >= launchAtMs) {
            game.launch();
            launchAtMs = null;
          }
        }
        if (game.state === "playing") autopilot(dtSec);

        const before = game.liveBricks.map((brick) => ({ alive: brick.alive, level: brick.level }));
        game.update(dtSec);
        lastHits = [];
        game.liveBricks.forEach((brick, index) => {
          const snapshot = before[index];
          if (snapshot.level === brick.level && snapshot.alive === brick.alive) return;
          lastHits.push({
            col: brick.col,
            row: brick.row,
            levelBefore: snapshot.level,
            levelAfter: brick.level,
            destroyed: snapshot.alive && !brick.alive,
            x: brick.rect.x * SCALE,
            y: brick.rect.y * SCALE,
            w: brick.rect.width * SCALE,
            h: brick.rect.height * SCALE,
          });
        });
        draw();
      };

      window.__stats = function stats() {
        let remaining = 0;
        let aliveBricks = 0;
        for (const brick of game.liveBricks) {
          if (brick.alive) {
            remaining += brick.count;
            aliveBricks += 1;
          }
        }
        return {
          state: game.state,
          remaining,
          aliveBricks,
          totalContributions: TOTAL_CONTRIBUTIONS,
          totalBricks: TOTAL_BRICKS,
          balls: game.ballStates.length,
          life: game.life,
          hits: lastHits,
        };
      };

      // hud text (theme=site only) must read in the pixel font, not a
      // fallback — including on the very first paint below, since
      // `still --at 0` screenshots this initial draw() without ever calling
      // __advance. document.fonts.load() resolves (not rejects) even if the
      // font fails to fetch, so this can never hang __ready.
      await document.fonts.load('16px "DotGothic16"');
      draw();
      window.__ready = true;
    </script>
  </body>
</html>
